name: CI and security
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2
      - name: Syntax and behavior
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
          php tests/run.php
          node --check assets/player.js
      - name: WordPress security coding standard
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --no-progress --no-plugins --no-scripts --prefer-dist
          composer audit --no-interaction
          vendor/bin/phpcs --config-set installed_paths vendor/wp-coding-standards/wpcs,vendor/phpcsstandards/phpcsextra,vendor/phpcsstandards/phpcsutils
          vendor/bin/phpcs --standard=phpcs.xml.dist
      - name: Workflow security
        run: pipx run --spec zizmor==1.30.1 zizmor --no-online-audits --min-severity medium .github/
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
  codeql:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@977e6ceaea7361825998245d787fa3b4d6b9e5df
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@977e6ceaea7361825998245d787fa3b4d6b9e5df
